const defaultItinerary=JSON.parse(JSON.stringify(itinerary));
function fmt(n){n=Number(n||0);return Math.abs(n%1)<.001?n.toString():n.toFixed(1)}
function render(){renderTodos();renderExpenses();renderTabs();renderPanels()}
function renderTodos(){const el=document.getElementById('todoList');el.innerHTML='';todos.forEach((t,i)=>{const c=document.createElement('div');c.className='todo-chip'+(t.done?' done':'');c.innerHTML=`<div class="todo-cb"></div>${t.label}`;c.onclick=()=>{todos[i].done=!todos[i].done;afterDataChange()};el.appendChild(c)})}
function renderExpenseModeTabs(){const el=document.getElementById('expenseModeTabs');el.innerHTML='';[{key:'total',label:'總花費'},{key:'advance',label:'墊付／預付款'}].forEach(t=>{const tab=document.createElement('div');tab.className='expense-mode-tab'+(expenseViewMode===t.key?' active':'');tab.innerHTML=`<span class="dn">${t.label}</span>`;tab.onclick=()=>{expenseViewMode=t.key;renderExpenses()};el.appendChild(tab)})}
function getCurrentSettlementSnapshot(){let owedByMumu=0,owedByBoyu=0,paidByMumu=0,paidByBoyu=0;expenses.forEach(e=>{const payer=e.payer||(e.who==='boyu'?'boyu':'mumu');if(payer==='mumu')paidByMumu+=Number(e.amount||0);if(payer==='boyu')paidByBoyu+=Number(e.amount||0);if(e.who==='shared'){owedByMumu+=e.amount/2;owedByBoyu+=e.amount/2}else if(e.who==='mumu'){owedByMumu+=e.amount}else if(e.who==='boyu'){owedByBoyu+=e.amount}});let rawMumuNet=paidByMumu-owedByMumu;let rawBoyuNet=paidByBoyu-owedByBoyu;prepayments.forEach(p=>{const amount=Number(p.amount||0);if(!amount)return;if(p.from==='mumu'&&p.to==='boyu'){rawMumuNet+=amount;rawBoyuNet-=amount}else if(p.from==='boyu'&&p.to==='mumu'){rawBoyuNet+=amount;rawMumuNet-=amount}});const adjustedMumuNet=rawMumuNet-Number(settledOffsets.mumu||0);const adjustedBoyuNet=rawBoyuNet-Number(settledOffsets.boyu||0);const mumuAdvanceTotal=Math.max(adjustedMumuNet,0);const boyuAdvanceTotal=Math.max(adjustedBoyuNet,0);let mainText='目前沒有墊付資料',subText='新增花費時指定實際付款人，或新增預付款後，這裡就會自動計算。',amount=0,direction='none';if(expenses.length||prepayments.length||settledOffsets.mumu||settledOffsets.boyu){if(Math.abs(adjustedMumuNet)<.01&&Math.abs(adjustedBoyuNet)<.01){mainText='目前已經結清，不需要互相還款';subText='雙方目前的墊付金額已經平衡。'}else if(adjustedMumuNet>0){amount=Math.abs(adjustedMumuNet);direction='boyu_to_mumu';mainText=`波魚應還小姆 HKD ${fmt(amount)}`;const shared=expenses.filter(e=>e.who==='shared').reduce((a,b)=>a+Number(b.amount||0),0);subText=`共同花費 HKD ${fmt(shared)}，每人應分攤 HKD ${fmt(shared/2)}。小姆目前墊付較多。`}else{amount=Math.abs(adjustedBoyuNet);direction='mumu_to_boyu';mainText=`小姆應還波魚 HKD ${fmt(amount)}`;const shared=expenses.filter(e=>e.who==='shared').reduce((a,b)=>a+Number(b.amount||0),0);subText=`共同花費 HKD ${fmt(shared)}，每人應分攤 HKD ${fmt(shared/2)}。波魚目前墊付較多。`}}return{mainText,subText,amount,direction,mumuAdvanceTotal,boyuAdvanceTotal,adjustedMumuNet,adjustedBoyuNet}}
function renderExpenses(){renderExpenseModeTabs();const summary=document.getElementById('expenseSummaryWrap'),settle=document.getElementById('expenseSettlement');if(expenseViewMode==='advance'){summary.style.display='none';settle.style.display='block';renderSettlement();return}summary.style.display='';settle.style.display='none';const shared=expenses.filter(e=>e.who==='shared').reduce((a,b)=>a+Number(b.amount||0),0),mumu=expenses.filter(e=>e.who==='mumu').reduce((a,b)=>a+Number(b.amount||0),0),boyu=expenses.filter(e=>e.who==='boyu').reduce((a,b)=>a+Number(b.amount||0),0);document.getElementById('totalNum').textContent=fmt(shared+mumu+boyu);document.getElementById('sharedAmt').textContent='HKD '+fmt(shared);document.getElementById('mumuAmt').textContent='HKD '+fmt(mumu);document.getElementById('boyuAmt').textContent='HKD '+fmt(boyu);const log=document.getElementById('expenseLog');log.innerHTML='';expenses.slice().reverse().forEach((e,ri)=>{const i=expenses.length-1-ri;const labels={shared:'共同',mumu:'小姆',boyu:'波魚'},bcs={shared:'eb-shared',mumu:'eb-mumu',boyu:'eb-boyu'};const row=document.createElement('div');row.className='exp-row';row.innerHTML=`<div class="exp-row-left"><span class="exp-badge ${bcs[e.who]}">${labels[e.who]}</span><span class="exp-badge" style="background:#f3f4f6;color:#6b7280;">${e.payer==='boyu'?'波魚付款':'小姆付款'}</span><span class="exp-desc">${e.desc}</span></div><div class="exp-right"><span class="exp-amt">HKD ${fmt(e.amount)}</span><button class="btn-del-exp" onclick="deleteExpense(${i})">×</button></div>`;log.appendChild(row)})}
function renderSettlement(){const s=getCurrentSettlementSnapshot(),el=document.getElementById('expenseSettlement');el.innerHTML=`<div class="settle-grid"><div class="settle-card"><div class="settle-label">小姆總墊付金額</div><div class="settle-value">HKD ${fmt(s.mumuAdvanceTotal)}</div></div><div class="settle-card"><div class="settle-label">波魚總墊付金額</div><div class="settle-value">HKD ${fmt(s.boyuAdvanceTotal)}</div></div></div><div class="settle-main"><div class="settle-main-title">墊付結算｜可新增誰給誰多少錢</div><div class="settle-main-text">${s.mainText}</div><div class="settle-sub">${s.subText}</div><div class="settle-actions"><button class="btn-prepay" id="openPrepayBtn" type="button">＋ 預付款</button><button class="btn-settle" id="settleAdvanceBtn" type="button">結清</button></div></div><div class="settle-records"><div class="settle-records-title">結清紀錄</div><div id="settlementRecords"></div></div><div class="prepay-records"><div class="prepay-records-title">預付款紀錄</div><div id="prepaymentRecords"></div></div>`;document.getElementById('openPrepayBtn').onclick=()=>openPrepayModal();document.getElementById('settleAdvanceBtn').onclick=()=>settleAdvance();renderSettlementRecords();renderPrepaymentRecords()}
function renderSettlementRecords(){const wrap=document.getElementById('settlementRecords');if(!wrap)return;if(!settlementRecords.length){wrap.innerHTML='<div class="settle-record-empty">目前還沒有結清紀錄</div>';return}wrap.innerHTML=settlementRecords.map((r,i)=>({...r,_i:i})).slice().reverse().map(r=>`<div class="settle-record-item"><div class="settle-record-head"><div class="settle-record-main">${r.timeText}</div><div style="display:flex;align-items:center;gap:8px;"><div class="settle-record-time">HKD ${r.amountText}</div><button class="btn-del-settle" onclick="deleteSettlementRecord(${r._i})">×</button></div></div></div>`).join('')}
function renderPrepaymentRecords(){const wrap=document.getElementById('prepaymentRecords');if(!wrap)return;const name={mumu:'小姆',boyu:'波魚'};if(!prepayments.length){wrap.innerHTML='<div class="prepay-record-empty">目前還沒有預付款紀錄</div>';return}wrap.innerHTML=prepayments.map((p,i)=>({...p,_i:i})).slice().reverse().map(p=>`<div class="prepay-record-item"><div class="prepay-record-head"><div><div class="prepay-record-main">${name[p.from]} 給 ${name[p.to]}</div><div class="prepay-record-sub">${p.timeText||''}${p.note?' · '+p.note:''}</div></div><div style="display:flex;align-items:center;gap:8px;"><div class="prepay-record-amt">HKD ${fmt(p.amount)}</div><button class="btn-del-settle" onclick="deletePrepayment(${p._i})">×</button></div></div></div>`).join('')}
window.settleAdvance=function(){const s=getCurrentSettlementSnapshot();if(s.amount<=0){alert('目前沒有需要結清的墊付金額');return}if(!confirm(`確認結清這筆金額？\n${s.mainText}`))return;const now=new Date(),timeText=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;if(s.direction==='boyu_to_mumu'){settledOffsets.mumu=Number(settledOffsets.mumu||0)+s.amount;settledOffsets.boyu=Number(settledOffsets.boyu||0)-s.amount}else if(s.direction==='mumu_to_boyu'){settledOffsets.mumu=Number(settledOffsets.mumu||0)-s.amount;settledOffsets.boyu=Number(settledOffsets.boyu||0)+s.amount}settlementRecords.push({timeText,amountText:fmt(s.amount)});afterDataChange()}
function deleteSettlementRecord(i){if(i<0||i>=settlementRecords.length)return;if(!confirm('確認刪除這筆結清紀錄？'))return;settlementRecords.splice(i,1);settledOffsets={mumu:0,boyu:0};afterDataChange()}
function renderTabs(){const el=document.getElementById('tabs');el.innerHTML='';itinerary.forEach((d,i)=>{const key=`${TRIP_YEAR}-${d.date.slice(0,2)}-${d.date.slice(3,5)}`;const wx=hkoForecastByDate[key]||{emoji:'⏳',desc:'尚未進入香港天文台 9 天天氣預報範圍'};const tab=document.createElement('div');tab.className='tab'+(i===activeDay?' active':'');tab.innerHTML=`<span class="dn">${d.label}<span class="day-weather-badge" title="${wx.desc}">${wx.emoji}</span></span><span class="dd">${d.date}</span>`;tab.onclick=()=>{activeDay=i;renderTabs();renderPanels()};el.appendChild(tab)})}
function renderPanels(){const el=document.getElementById('panels');el.innerHTML='';itinerary.forEach((d,di)=>{const panel=document.createElement('div');panel.className='day-panel'+(di===activeDay?' active':'');if(d.flight){panel.innerHTML+=`<div class="flight-card"><div class="flight-icon">✈️</div><div><div class="flight-num">${d.flight.num}</div><div class="flight-route">${d.flight.route}</div><div class="flight-time">${d.flight.time}</div></div></div>`}const dc=document.createElement('div');dc.className='day-card';const key=`${TRIP_YEAR}-${d.date.slice(0,2)}-${d.date.slice(3,5)}`;const wx=hkoForecastByDate[key]||{emoji:'⏳',desc:'尚未進入香港天文台 9 天天氣預報範圍'};dc.innerHTML=`<div class="day-banner"><div class="day-banner-l"><div class="day-label">${d.label}<span class="day-weather-badge" title="${wx.desc}">${wx.emoji}</span></div><div class="day-info">${d.date} · ${d.city}</div></div><button class="btn-add-item" onclick="openAddModal(${di})">＋ 新增</button></div>`;d.groups.forEach((g,gi)=>{const tc=g.time==='早上'?'tp-morn':g.time==='下午'?'tp-noon':'tp-night';dc.innerHTML+=`<div class="time-row"><div class="time-pill ${tc}">${g.time}</div><div class="time-div"></div></div>`;const list=document.createElement('div');list.className='item-list';if(!g.items.length)list.innerHTML='<div class="empty">尚無行程</div>';g.items.forEach((item,ii)=>{const row=document.createElement('div');row.className='item-row';const nameHtml=item.url?`<a href="${item.url}" target="_blank" rel="noopener">${item.name}</a>`:item.name;row.innerHTML=`<div class="type-icon-wrap">${iconMap[item.type]||'📌'}</div><div class="item-body"><div class="item-name">${nameHtml}</div><div class="item-tags">${item.location?`<span class="tag-loc">📍 ${item.location}</span>`:''}${item.booked?`<span class="tag-booked">✓ 已預約</span>`:''}</div>${item.note?`<div class="item-note">${item.note}</div>`:''}</div><div class="item-actions"><button class="btn-icon btn-edit-i" onclick="event.stopPropagation();openEditModal(${di},${gi},${ii})">✏️</button><button class="btn-icon btn-del-i" onclick="event.stopPropagation();deleteItem(${di},${gi},${ii})">🗑️</button></div>`;list.appendChild(row)});dc.appendChild(list)});panel.appendChild(dc);el.appendChild(panel)})}
function openAddModal(di){pendingDayIdx=di;editTarget=null;document.getElementById('itemModalTitle').textContent='新增行程';document.getElementById('f-type').selectedIndex=0;document.getElementById('f-time').selectedIndex=0;['f-name','f-url','f-location','f-note'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-booked').value='0';document.getElementById('itemModal').classList.add('open')}
function openEditModal(di,gi,ii){editTarget={di,gi,ii};pendingDayIdx=di;const item=itinerary[di].groups[gi].items[ii];document.getElementById('itemModalTitle').textContent='編輯行程';document.getElementById('f-type').value=item.type;document.getElementById('f-time').value=itinerary[di].groups[gi].time;document.getElementById('f-name').value=item.name;document.getElementById('f-url').value=item.url||'';document.getElementById('f-location').value=item.location||'';document.getElementById('f-note').value=item.note||'';document.getElementById('f-booked').value=item.booked?'1':'0';document.getElementById('itemModal').classList.add('open')}
function closeItemModal(){document.getElementById('itemModal').classList.remove('open')}function saveItem(){const name=document.getElementById('f-name').value.trim();if(!name){alert('請輸入名稱！');return}const newItem={type:document.getElementById('f-type').value,name,url:document.getElementById('f-url').value.trim(),location:document.getElementById('f-location').value.trim(),note:document.getElementById('f-note').value.trim(),booked:document.getElementById('f-booked').value==='1'};const time=document.getElementById('f-time').value;if(editTarget){const{di,gi,ii}=editTarget;if(itinerary[di].groups[gi].time!==time){itinerary[di].groups[gi].items.splice(ii,1);let tg=itinerary[di].groups.find(g=>g.time===time);if(!tg){itinerary[di].groups.push({time,items:[]});tg=itinerary[di].groups.at(-1)}tg.items.push(newItem)}else itinerary[di].groups[gi].items[ii]=newItem}else{let tg=itinerary[pendingDayIdx].groups.find(g=>g.time===time);if(!tg){itinerary[pendingDayIdx].groups.push({time,items:[]});tg=itinerary[pendingDayIdx].groups.at(-1)}tg.items.push(newItem)}closeItemModal();afterDataChange()}function deleteItem(di,gi,ii){if(!confirm('確定刪除？'))return;itinerary[di].groups[gi].items.splice(ii,1);afterDataChange()}
function openExpenseModal(){document.getElementById('e-who').value='shared';document.getElementById('e-payer').value='mumu';document.getElementById('e-desc').value='';document.getElementById('e-amount').value='';document.getElementById('expenseModal').classList.add('open')}function closeExpenseModal(){document.getElementById('expenseModal').classList.remove('open')}function saveExpense(){const desc=document.getElementById('e-desc').value.trim(),amount=parseFloat(document.getElementById('e-amount').value);if(!desc){alert('請輸入項目名稱！');return}if(isNaN(amount)||amount<=0){alert('請輸入有效金額！');return}expenses.push({who:document.getElementById('e-who').value,payer:document.getElementById('e-payer').value,desc,amount});closeExpenseModal();afterDataChange()}function deleteExpense(i){expenses.splice(i,1);afterDataChange()}
function openPrepayModal(){document.getElementById('p-from').value='mumu';document.getElementById('p-to').value='boyu';document.getElementById('p-amount').value='';document.getElementById('p-note').value='';document.getElementById('prepayModal').classList.add('open')}function closePrepayModal(){document.getElementById('prepayModal').classList.remove('open')}function savePrepayment(){const from=document.getElementById('p-from').value,to=document.getElementById('p-to').value,amount=parseFloat(document.getElementById('p-amount').value),note=document.getElementById('p-note').value.trim();if(from===to){alert('給錢的人和收錢的人不能一樣！');return}if(isNaN(amount)||amount<=0){alert('請輸入有效金額！');return}const now=new Date(),timeText=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;prepayments.push({from,to,amount,note,timeText});closePrepayModal();expenseViewMode='advance';afterDataChange()}function deletePrepayment(i){if(i<0||i>=prepayments.length)return;if(!confirm('確認刪除這筆預付款？'))return;prepayments.splice(i,1);afterDataChange()}
function openTodoModal(){document.getElementById('t-label').value='';document.getElementById('todoModal').classList.add('open')}function closeTodoModal(){document.getElementById('todoModal').classList.remove('open')}function saveTodo(){const label=document.getElementById('t-label').value.trim();if(!label){alert('請輸入項目！');return}todos.push({label,done:false});closeTodoModal();afterDataChange()}
['itemModal','expenseModal','prepayModal','todoModal'].forEach(id=>document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('open')}));
function getPayload(){return{todos,expenses,prepayments,settlementRecords,settledOffsets,itinerary,updatedAt:Date.now()}}
async function saveCloudData(showStatus=true){if(!cloudReady||applyingRemoteData)return;try{if(showStatus)updateSyncStatus('☁️ 同步中...');await setDoc(tripDocRef,{...getPayload(),serverUpdatedAt:serverTimestamp()},{merge:true});if(showStatus)updateSyncStatus('☁️ 已同步到雲端')}catch(e){console.error(e);updateSyncStatus('⚠️ 雲端同步失敗')}}
async function bootstrapCloud(){if(!cloudReady)return;try{const snap=await getDoc(tripDocRef);if(!snap.exists()){await saveCloudData(false);updateSyncStatus('☁️ 已建立共享資料')}else{const data=snap.data();applyingRemoteData=true;todos=Array.isArray(data.todos)?data.todos:todos;expenses=Array.isArray(data.expenses)?data.expenses:expenses;prepayments=Array.isArray(data.prepayments)?data.prepayments:prepayments;settlementRecords=Array.isArray(data.settlementRecords)?data.settlementRecords:settlementRecords;settledOffsets=data.settledOffsets&&typeof data.settledOffsets==='object'?data.settledOffsets:settledOffsets;itinerary=Array.isArray(data.itinerary)?data.itinerary:itinerary;applyingRemoteData=false;render();updateSyncStatus('☁️ 已載入雲端資料')}onSnapshot(tripDocRef,docSnap=>{if(!docSnap.exists())return;const data=docSnap.data();applyingRemoteData=true;todos=Array.isArray(data.todos)?data.todos:todos;expenses=Array.isArray(data.expenses)?data.expenses:expenses;prepayments=Array.isArray(data.prepayments)?data.prepayments:prepayments;settlementRecords=Array.isArray(data.settlementRecords)?data.settlementRecords:settlementRecords;settledOffsets=data.settledOffsets&&typeof data.settledOffsets==='object'?data.settledOffsets:settledOffsets;itinerary=Array.isArray(data.itinerary)?data.itinerary:itinerary;applyingRemoteData=false;render();updateSyncStatus('☁️ 已與雲端同步')},err=>{console.error(err);updateSyncStatus('⚠️ 監聽同步失敗')})}catch(e){console.error(e);updateSyncStatus('⚠️ 無法讀取雲端資料')}}
window.syncNow=async function(){await saveCloudData(true)};window.resetCloudData=async function(){if(!confirm('確定把雲端資料重設為原始預設行程？'))return;todos=[{label:'保險',done:true},{label:'機票劃位',done:false},{label:'轉接頭',done:false},{label:'eSIM',done:true},{label:'兵役',done:true}];expenses=[];prepayments=[];settlementRecords=[];settledOffsets={mumu:0,boyu:0};itinerary=JSON.parse(JSON.stringify(defaultItinerary));activeDay=0;afterDataChange()};function afterDataChange(){render();saveCloudData(false)}
Object.assign(window,{openAddModal,openEditModal,closeItemModal,saveItem,deleteItem,openExpenseModal,closeExpenseModal,saveExpense,deleteExpense,openPrepayModal,closePrepayModal,savePrepayment,deletePrepayment,openTodoModal,closeTodoModal,saveTodo,deleteSettlementRecord});
const HKO_9DAY_FORECAST_URL='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc';function mapHKOForecastIconToEmoji(code){const n=Number(code);if([50,51,52,53].includes(n))return'☀️';if([54].includes(n))return'🌤️';if([60,61].includes(n))return'☁️';if([62,63].includes(n))return'🌦️';if([64,65].includes(n))return'⛈️';if([70,71,72,73,74,75].includes(n))return'🌙';if([76,77].includes(n))return'🌥️';if([80].includes(n))return'💨';if([83,84,85].includes(n))return'🌫️';return'⛅'}async function refreshHongKongForecastOnce(){try{const res=await fetch(HKO_9DAY_FORECAST_URL,{cache:'no-store'});if(!res.ok)throw new Error('HKO HTTP '+res.status);const data=await res.json(),map={};(Array.isArray(data.weatherForecast)?data.weatherForecast:[]).forEach(item=>{const fd=String(item.forecastDate||'');if(fd.length===8){const key=`${fd.slice(0,4)}-${fd.slice(4,6)}-${fd.slice(6,8)}`;const minT=item.forecastMintemp?.value,maxT=item.forecastMaxtemp?.value,tempText=(minT!=null&&maxT!=null)?`｜${minT}–${maxT}°C`:'';map[key]={emoji:mapHKOForecastIconToEmoji(item.ForecastIcon),desc:`${item.forecastWeather||'香港天文台 9 天天氣預報'}${tempText}`}}});hkoForecastByDate=map;renderTabs();renderPanels()}catch(e){console.warn('HKO forecast fetch failed:',e)}}
refreshHongKongForecastOnce();render();bootstrapCloud();
</script>
